name: Mercurius
options:
  bundleIdPrefix: com.mayoailiteracy
  deploymentTarget:
    iOS: "17.0"
    # The native Mac app (MercuriusMac). Matches the packages' floor in
    # Packages/Package.swift — the iOS 17-era SwiftUI surface.
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    # NOTE: ENABLE_USER_SCRIPT_SANDBOXING is intentionally off — our xattr
    # strip script needs to write to the .app bundle. Re-enable during
    # App Store hardening if Apple ever requires it for iOS (currently
    # only a warning, not a rejection).
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "2.3.1"
    CURRENT_PROJECT_VERSION: "18"
    DEVELOPMENT_TEAM: "TMBPRHZYW2"
  configs:
    # Pin signing per configuration. Debug stays on automatic (Xcode handles
    # local-dev signing on the simulator just fine). Release uses MANUAL
    # signing with Apple Distribution — this is the key to making TestFlight
    # archives work on a brand-new team:
    #
    #   With automatic signing, `xcodebuild archive` does a pre-flight check
    #   that requires a working *Development* provisioning profile, which
    #   needs at least one registered device on the team. We have zero
    #   devices on purpose (App Store distribution doesn't need any), so
    #   automatic signing deadlocks before it even gets to the distribution
    #   step. Manual signing skips that pre-flight, and with
    #   `-allowProvisioningUpdates` + the App Store Connect API key,
    #   xcodebuild can still create a Distribution cert + profile on
    #   demand — without ever asking for a dev profile.
    Debug:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Apple Distribution"

packages:
  LocalPackages:
    path: Packages
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.17.0"

targets:
  Mercurius:
    type: application
    platform: iOS
    sources:
      - path: Mercurius
    resources:
      - Mercurius/Resources/Assets.xcassets
      # Privacy manifest — required by the App Store since May 2024.
      # Declares: no tracking, the two data types we collect
      # (session id + chat content, neither linked to user identity),
      # and our one required-reason API use (UserDefaults, CA92.1).
      - Mercurius/Resources/PrivacyInfo.xcprivacy
    postBuildScripts:
      - name: Strip extended attributes (macOS workaround for codesign)
        script: |
          # macOS adds com.apple.FinderInfo / com.apple.provenance to
          # files during write. Stripped codesign (-) rejects these.
          # Run as the last script phase so it executes AFTER Copy
          # Bundle Resources (which also re-adds xattrs) and right
          # before codesign.
          if [ -d "${TARGET_BUILD_DIR}" ]; then
            /usr/bin/xattr -cr "${TARGET_BUILD_DIR}"
          fi
        basedOnDependencyAnalysis: false
        runOnlyWhenInstalling: false
    dependencies:
      - package: LocalPackages
        product: AppFeature
      - package: LocalPackages
        product: ChatFeature
      - package: LocalPackages
        product: CurriculumFeature
      - package: LocalPackages
        product: SettingsFeature
      - package: LocalPackages
        product: PersistenceKit
      - package: LocalPackages
        product: DesignSystem
      - package: LocalPackages
        product: NetworkingKit
      # MercuriusApp installs EngagementFeature's NotificationRouter as the
      # notification-center delegate at launch.
      - package: LocalPackages
        product: EngagementFeature
      # Widget extension hosting the learning-session Live Activity
      # (lock screen banner + Dynamic Island). Embedded into PlugIns.
      - target: MercuriusWidgets
        embed: true
    info:
      path: Mercurius/Resources/Info.plist
      properties:
        CFBundleDisplayName: Mercurius
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleDefault
        # Dark only (Night Studio, docs/ios-night-only/PR.md): the launch,
        # alerts, the keyboard and the system's share and print sheets are
        # dark too, whatever the phone's own appearance. The widget
        # extension (the Live Activity) has no such key: it follows the
        # system.
        UIUserInterfaceStyle: Dark
        # iPhone stays portrait-only — designed for a single full-screen
        # reading/typing context on phone.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad (and "iPad apps on Mac") support all four orientations. This is
        # what lets the window RESIZE and fill a Mac screen, instead of being
        # pinned to a fixed, phone-shaped portrait window. Declaring all four
        # iPad orientations also satisfies the App Store validator's
        # multitasking requirement, which is the only reason the build needed
        # UIRequiresFullScreen before — so that key is now removed (its presence
        # is what locked the Mac/iPad window to a fixed size).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Declare encryption compliance: we use only HTTPS/TLS over
        # URLSession, which is exempt from US export review. Setting
        # this to false skips the annual compliance questionnaire on
        # every App Store submission.
        ITSAppUsesNonExemptEncryption: false
        # Keep ATS strict: HTTPS only, no arbitrary loads. Our backend
        # is hosted on Railway (https) and the club JSON lives on the
        # mayoailiteracy.com TLS cert.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        # App Store Connect category. Drives where users discover us.
        LSApplicationCategoryType: public.app-category.education
        # Learning-session Live Activity (lock screen + Dynamic Island).
        NSSupportsLiveActivities: true
        # Deep links: mercurius://session (Live Activity tap → learning
        # path) and mercurius://lesson/<id> (reminder tap → that lesson).
        CFBundleURLTypes:
          - CFBundleURLName: com.mayoailiteracy.mercurius.native
            CFBundleURLSchemes:
              - mercurius
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mayoailiteracy.mercurius.native
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
      configs:
        # Mirror the project-level signing config at the target level —
        # xcodegen leaves the per-target CODE_SIGN_IDENTITY as
        # "iPhone Developer" by default, which would otherwise override
        # our project-level Apple Distribution setting at archive time.
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          # Named profile that release.sh will create on the fly via the
          # App Store Connect API if it doesn't already exist locally.
          # Manual signing requires SOME profile name; this lets the
          # script bootstrap a Distribution profile without ever needing
          # an interactive Xcode sign-in.
          PROVISIONING_PROFILE_SPECIFIER: "Mercurius App Store"

  MercuriusWidgets:
    # WidgetKit extension — a thin @main WidgetBundle shell. The Live
    # Activity itself (attributes, views, theme, controller) lives in the
    # shared MercuriusActivity package so the app can start/update it with
    # the same types.
    type: app-extension
    platform: iOS
    sources:
      - path: MercuriusWidgets
    dependencies:
      - package: LocalPackages
        product: MercuriusActivity
      - package: LocalPackages
        product: DesignSystem
    info:
      path: MercuriusWidgets/Info.plist
      properties:
        CFBundleDisplayName: Mercurius Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    postBuildScripts:
      - name: Strip extended attributes (macOS workaround for codesign)
        script: |
          # Same workaround as the app target — the appex is signed in its
          # own target build, and inherits the same xattr detritus.
          if [ -d "${TARGET_BUILD_DIR}" ]; then
            /usr/bin/xattr -cr "${TARGET_BUILD_DIR}"
          fi
        basedOnDependencyAnalysis: false
        runOnlyWhenInstalling: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mayoailiteracy.mercurius.native.MercuriusWidgets
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        # Must match (or superset) the app's device families — App Store
        # validation rejects an appex narrower than its host.
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          # Extensions need their own provisioning profile at archive time;
          # release.sh bootstraps it via the App Store Connect API the same
          # way it does the app profile.
          PROVISIONING_PROFILE_SPECIFIER: "Mercurius Widgets App Store"

  MercuriusMac:
    # The native SwiftUI Mac app (not Catalyst, not the iPad app on Mac).
    # Ships on the Mac App Store as a UNIVERSAL PURCHASE with the iOS app:
    # the same bundle id in the same App Store Connect record, so Release
    # (archive) builds use com.mayoailiteracy.mercurius.native exactly.
    # Like the iOS target this is a thin shell: the App, the scenes and
    # the DEBUG screenshot harness. The window's content (bootstrap,
    # consent gate, NavigationSplitView shell) lives in AppFeature.
    # See docs/mac-app/.
    type: application
    platform: macOS
    sources:
      - path: MercuriusMac
      # The shared brand art (LogoIcon / LogoIconDark / LogoHero, the
      # LaunchBackground + AccentColor colours) — one copy for both apps.
      # Its iOS-only AppIcon set is ignored here; the Mac icon is
      # MacAppIcon (MercuriusMac/Resources/MacAssets.xcassets, made from
      # the iOS icon by scripts/make-mac-icon.py).
      - path: Mercurius/Resources/Assets.xcassets
      # The same privacy manifest as iOS: the Mac app collects the same
      # data for the same purposes and calls the same required-reason API.
      - path: Mercurius/Resources/PrivacyInfo.xcprivacy
    postBuildScripts:
      - name: Strip extended attributes (macOS workaround for codesign)
        script: |
          # Same workaround as the iOS targets: Copy Bundle Resources
          # re-adds com.apple.FinderInfo / provenance xattrs, which
          # codesign rejects. Last script phase, right before signing.
          if [ -d "${TARGET_BUILD_DIR}" ]; then
            /usr/bin/xattr -cr "${TARGET_BUILD_DIR}"
          fi
        basedOnDependencyAnalysis: false
        runOnlyWhenInstalling: false
    dependencies:
      - package: LocalPackages
        product: AppFeature
      - package: LocalPackages
        product: DesignSystem
    info:
      path: MercuriusMac/Info.plist
      properties:
        CFBundleName: Mercurius
        CFBundleDisplayName: Mercurius
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Same answers as the iOS Info.plist (see the comments there).
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        LSApplicationCategoryType: public.app-category.education
        # mercurius://lesson/<id> opens that lesson (AppEntryView.onOpenURL).
        CFBundleURLTypes:
          - CFBundleURLName: com.mayoailiteracy.mercurius.native
            CFBundleURLSchemes:
              - mercurius
    entitlements:
      path: MercuriusMac/MercuriusMac.entitlements
      properties:
        # The Mac App Store requires the sandbox.
        com.apple.security.app-sandbox: true
        # HTTPS to the Railway backend (chat SSE, progress, reports).
        com.apple.security.network.client: true
        # A photo the student picks to attach to a chat message (read), and
        # where they save their certificate's PDF (write): only files the
        # student picks in an open or save panel.
        com.apple.security.files.user-selected.read-write: true
        # Printing the certificate (sandboxed apps need it to print).
        com.apple.security.print: true
    settings:
      base:
        PRODUCT_NAME: Mercurius
        # The app module needs its own name: "Mercurius" is the iOS app's.
        PRODUCT_MODULE_NAME: MercuriusMac
        PRODUCT_BUNDLE_IDENTIFIER: com.mayoailiteracy.mercurius.native
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: MacAppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          # Local builds only: a separate id, so a Debug run never shares a
          # sandbox container, Keychain item or URL scheme with an installed
          # Mercurius (the App Store iPad app on a Mac uses the real id —
          # and the same ~/Library/Containers folder). Release keeps the
          # real id for the universal purchase.
          PRODUCT_BUNDLE_IDENTIFIER: com.mayoailiteracy.mercurius.native.macdev
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          # A Mac App Store profile for com.mayoailiteracy.mercurius.native,
          # not created yet (docs/mac-app/PLAN.md, release step).
          PROVISIONING_PROFILE_SPECIFIER: "Mercurius Mac App Store"

  MercuriusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MercuriusTests
    dependencies:
      - target: Mercurius
      - package: LocalPackages
        product: NetworkingKit
      - package: LocalPackages
        product: DesignSystem
      - package: LocalPackages
        product: ChatFeature
      - package: LocalPackages
        product: CurriculumFeature
      - package: LocalPackages
        product: SettingsFeature
      - package: LocalPackages
        product: MercuriusActivity
      - package: SnapshotTesting
        product: SnapshotTesting
    postCompileScripts:
      - name: Strip extended attributes (macOS workaround for codesign)
        script: |
          if [ -d "${TARGET_BUILD_DIR}" ]; then
            /usr/bin/xattr -cr "${TARGET_BUILD_DIR}"
          fi
        basedOnDependencyAnalysis: false
        runOnlyWhenInstalling: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mayoailiteracy.mercurius.native.tests
        GENERATE_INFOPLIST_FILE: YES

  MercuriusUITests:
    # XCUITest bundle — exercises the app end-to-end through the
    # accessibility API. These tests do NOT require network: all the
    # flows covered (boot, tab switch, starter prompt presence, settings
    # sheet, mode selector, Dynamic Type scaling) are client-side only.
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MercuriusUITests
    dependencies:
      - target: Mercurius
    postCompileScripts:
      - name: Strip extended attributes (macOS workaround for codesign)
        script: |
          if [ -d "${TARGET_BUILD_DIR}" ]; then
            /usr/bin/xattr -cr "${TARGET_BUILD_DIR}"
          fi
        basedOnDependencyAnalysis: false
        runOnlyWhenInstalling: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mayoailiteracy.mercurius.native.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Mercurius

schemes:
  Mercurius:
    build:
      targets:
        Mercurius: all
        MercuriusTests: [test]
        MercuriusUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # Gather code-coverage data every time this scheme's tests run.
      # `scripts/coverage.sh` drives a full run and extracts a summary;
      # Xcode's own report viewer also works out of the box. We
      # intentionally omit `coverageTargets:` so every linked framework
      # (including all SPM package products) gets instrumented, not
      # just the thin Mercurius.app shell.
      gatherCoverageData: true
      # NOTE: SPM package tests are NOT included here — xcodegen can't
      # reference them in schemes. Run them with:
      #   cd Packages && swift test --enable-code-coverage
      # UI tests live in MercuriusUITests. Run selectively via:
      #   xcodebuild test -only-testing:MercuriusUITests -scheme Mercurius ...
      targets:
        - MercuriusTests
        - MercuriusUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  MercuriusMac:
    # The native Mac app. No test targets yet: its logic is covered by
    # `swift test` (which runs on the macOS host and compiles every
    # `#if os(macOS)` path in AppFeature).
    build:
      targets:
        MercuriusMac: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
